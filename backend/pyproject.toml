[project]
name = "sylva-backend"
version = "1.0.0"
description = "Sylva: Sentinel-2 U-Net forest segmentation and multi-date change detection (FastAPI backend + forestwatch core)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to public data providers"]
filterwarnings = ["ignore::DeprecationWarning:pystac_client.*", "ignore::rasterio.errors.NotGeoreferencedWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "B905"]
